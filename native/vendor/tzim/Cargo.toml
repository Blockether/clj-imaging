[package]
edition = "2021"
rust-version = "1.88"
name = "tzim"
version = "0.16.3"
build = "build.rs"
exclude = [
    "docs/audits/",
    "handoff/",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Lossless file optimizer: shrink the file, never the information"
readme = "README.md"
keywords = [
    "lossless",
    "optimization",
    "png",
    "gzip",
    "jpeg",
]
categories = [
    "command-line-utilities",
    "compression",
]
license = "MIT"
repository = "https://github.com/RUdolf1517/tzim"

[features]
default = [
    "png",
    "gzip",
    "zip",
    "ico",
    "jpeg-v1",
    "tiff",
    "zlib",
    "zopfli",
]
fits = [
    "dep:flate2",
    "dep:crc32fast",
]
flac = [
    "dep:claxon",
    "dep:flacenc",
    "dep:md-5",
]
fuzz-api = []
gzip = [
    "dep:flate2",
    "dep:crc32fast",
]
ico = ["png"]
jpeg = []
jpeg-v1 = [
    "jpeg",
    "dep:jpeg-decoder",
    "dep:crc32fast",
]
pdf = ["zlib"]
png = [
    "dep:png",
    "dep:flate2",
    "dep:crc32fast",
]
tiff = ["dep:flate2"]
zip = [
    "dep:flate2",
    "dep:crc32fast",
]
zlib = ["dep:flate2"]
zopfli = ["dep:zopfli"]

[lib]
name = "tzim"
path = "src/lib.rs"

[[bin]]
name = "tzim"
path = "src/main.rs"

[[test]]
name = "cli"
path = "tests/cli.rs"

[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "packaging"
path = "tests/packaging.rs"

[[test]]
name = "verification"
path = "tests/verification.rs"

[dependencies.claxon]
version = "=0.4.3"
optional = true

[dependencies.crc32fast]
version = "1.5"
optional = true

[dependencies.flacenc]
version = "=0.5.1"
optional = true
default-features = false

[dependencies.flate2]
version = "1.1"
features = ["rust_backend"]
optional = true
default-features = false

[dependencies.jpeg-decoder]
version = "0.3"
features = ["platform_independent"]
optional = true
default-features = false

[dependencies.md-5]
version = "=0.10.6"
optional = true

[dependencies.png]
version = "0.18"
optional = true
default-features = false

[dependencies.zopfli]
version = "0.8"
features = ["std"]
optional = true
default-features = false

[lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
incremental = false
strip = "symbols"

[profile.release.package.jpeg-decoder]
opt-level = "s"

[profile.release.package."*"]
opt-level = 3
