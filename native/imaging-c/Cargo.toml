[package]
name = "imaging-c"
version = "0.1.0"
edition = "2024"
description = "Minimal C ABI over resvg + tiny-skia + image: SVG rasterisation, image codecs, 2D drawing, text and plotting for clj-imaging's FFM binding."
license = "MIT"

[lib]
name = "imaging_c"
crate-type = ["cdylib"]

[dependencies]
# Codecs. default-features off keeps rayon and the AVIF/C stack out; every format
# below is pure Rust, so the cdylib links with no system libraries at all.
image = { version = "0.25", default-features = false, features = [
  "png", "jpeg", "gif", "bmp", "ico", "tiff", "webp", "pnm", "tga", "qoi", "hdr", "exr",
] }
# resvg re-exports the EXACT tiny-skia + usvg it was built against; depend on
# those re-exports (never a second copy) or the pixmap types stop matching.
resvg = "0.47"
usvg = "0.47"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
oxipng = { version = "10.1.1", default-features = false, features = ["zopfli"] }
jpeg-encoder = "0.7.1"
gif = "0.14.2"
# Office (OOXML). Pure Rust, no system libraries and no Java: rust_xlsxwriter
# writes .xlsx, `zip` + hand-written WordprocessingML/PresentationML write .docx
# and .pptx, calamine reads .xlsx/.xls/.ods back. default-features off keeps the
# C compression stacks (zstd, bzip2, lzma) out of the cdylib.
rust_xlsxwriter = { version = "0.97", default-features = false, features = ["zlib"] }
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
calamine = { version = "0.36", default-features = false, features = ["dates"] }
quick-xml = "0.41"
# Gunzip for `.svgz`: usvg unzips a document it PARSES, but the browser-fallback
# sizing in svg.rs has to read the root tag's own attributes as TEXT. Already in
# the tree through `zip`, and pinned to the same zlib-rs backend so there is only
# one deflate implementation in the cdylib.
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
# Video. Both are pure Rust with no system codec and no build script: `re_mp4`
# demuxes ISO-BMFF (it is rerun's maintained fork of the `mp4` crate) and
# `rust_h264` decodes H.264/AVC Baseline/Main/High, CAVLC + CABAC, B-frames.
# That keeps the "links against nothing" property that lets this cdylib ship
# inside a GraalVM native image.
re_mp4 = "0.5"
# `rust_h264` is vendored under ../vendor with one fix: 0.4.0 orders the P-slice
# reference list by POC, which silently corrupts every stream that has more than
# one reference frame and runs past the frame_num wrap. See ../vendor/PATCHES.md.
rust_h264 = { path = "../vendor/rust_h264", version = "0.4" }
# Documents -> Markdown. `anydoc` is Firecrawl's pure-Rust document reader: it
# parses doc/docx/odt/rtf/pdf/ppt/pptx/epub/xlsx/ods/odp/csv itself, with no
# system library, no Java and no headless office, so it keeps the cdylib's
# "links against nothing" property. default-features off drops its CLI/logging
# extras; the codec crates it does pull (zip, flate2, quick-xml, calamine) are
# already in this tree.
anydoc = "0.1.3"

[profile.release]
lto = true
codegen-units = 1
strip = true
