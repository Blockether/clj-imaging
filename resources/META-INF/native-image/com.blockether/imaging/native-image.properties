# GraalVM native-image configuration for com.blockether/imaging.
# Auto-applied when this jar is on the native-image classpath. Pairs with the
# reachability-metadata.json in this directory (FFM downcalls + the bundled
# library resource).
#
# The POINT of this library is that an image which uses it needs NO java.desktop:
# no javax.imageio service loaders, no sun.java2d.loops JNI blit primitives, no
# AWT font manager. Decoding, drawing, text, SVG and plotting all happen inside
# the cdylib.
#
# Why each flag:
#   --enable-native-access      the binding loads the cdylib (SymbolLookup.
#                               libraryLookup) and builds downcall handles via
#                               the Foreign Function & Memory API.
#   ForeignAPISupport           enables the FFM downcall stubs in the image.
#
# NO --enable-preview: FFM is a STABLE API since JDK 22 (this binding compiles
# without preview).
#
# NO -H:+SharedArenaSupport: com.blockether.imaging/bind! uses Arena.ofAuto
# (long-lived, GC-managed) for the library lookup and Arena.ofConfined (per-call)
# for arguments — NEVER Arena.ofShared, which is INCOMPATIBLE with Truffle
# runtime compilation (an image that also embeds GraalPy fails with
# "Arena.ofShared is not supported with runtime compilations"). ofAuto/ofConfined
# need no flag.
#
# The cdylib itself is loaded at RUN TIME from IMAGING_NATIVE_PATH, the bundled
# prebuilds/<platform>/ resource (glob in reachability-metadata.json), or — on a
# plain JVM only — the tools.deps download cache. In a native image bundle the
# matching com.blockether/imaging-native-<platform> jar so the glob has something
# to embed, OR set IMAGING_NATIVE_PATH.
Args = --enable-native-access=ALL-UNNAMED \
       -H:+UnlockExperimentalVMOptions \
       -H:+ForeignAPISupport
